{% extends 'base.html' %}
{% block content %}
<h2>Login</h2>
<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Login</button>
</form>
<p style="margin-top: 16px;">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
