{% extends 'base.html' %}
{% block content %}
<h2>Register</h2>
<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Register</button>
</form>
<p style="margin-top: 16px;">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
