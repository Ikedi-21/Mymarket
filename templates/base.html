{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitMarket</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="{% url 'browse' %}" style="font-weight: 700; font-size: 20px; color: white;">DigitMarket</a>
                <div class="nav-links">
                    <a href="{% url 'browse' %}">Browse</a>
                    {% if user.is_authenticated %}
                        {% if user.role == 'seller' %}
                            <a href="{% url 'seller_dashboard' %}">Dashboard</a>
                            <a href="{% url 'orders_received' %}">Sales</a>
                        {% else %}
                            <a href="{% url 'my_purchases' %}">My Purchases</a>
                        {% endif %}
                        <form action="{% url 'logout' %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-secondary">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}">Login</a>
                        <a href="{% url 'register' %}" class="btn">Register</a>
                    {% endif %}
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container" style="text-align: center; margin-top: calc(var(--grid-unit) * 10); opacity: 0.6; font-size: 14px;">
        <p>&copy; 2024 DigitMarket. All rights reserved.</p>
    </footer>
</body>
</html>
