{% extends 'base.html' %}
{% block content %}
<h2>Orders Received</h2>
<div class="card" style="padding: 0; overflow-x: auto;">
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Buyer</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td style="font-weight: 600;">{{ order.product.title }}</td>
                <td>{{ order.buyer.username }}</td>
                <td style="color: var(--primary-color); font-weight: 600;">${{ order.amount_paid }}</td>
                <td style="opacity: 0.7; font-size: 14px;">{{ order.created_at|date:"M d, Y" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" style="text-align: center; padding: 40px; opacity: 0.6;">No orders received yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
